name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validar el contenido (campañas, fuentes, logros, láminas, glosario)
        run: npm run validate:content --prefix backend
      - name: Pruebas del backend
        run: npm test --prefix backend
      - name: Pruebas del frontend
        run: npm test --prefix frontend

  # Prisma contra un PostgreSQL real: las pruebas de contrato se omiten sin TEST_DATABASE_URL.
  prisma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: batalla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/batalla_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/batalla_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Generar el cliente y aplicar las migraciones (incluye 2_logro_villamontes y 3_resultados_preguntas)
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: backend
      - name: Pruebas de contrato del almacén Prisma
        run: node --test test/store.prisma.test.js
        working-directory: backend
