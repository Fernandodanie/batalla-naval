# Sirve el frontend y reenvía /api y /ws al backend (mismo origen: sin CORS).
# 127.0.0.11 es el DNS interno de Docker; con 'set $backend' nginx resuelve el nombre en cada
# petición, así que el frontend arranca aunque el backend todavía no esté listo.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;

  set $backend http://backend:4000;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass $backend;
  }

  # WebSocket: necesita HTTP/1.1 + cabeceras Upgrade, y un timeout largo para partidas largas.
  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # El service worker y el manifiesto no se guardan en caché: así una versión nueva llega enseguida.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; base-uri 'none'" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Pixel art, fotogramas del fondo de la entrada (jpg), video (mp4), música (mp3) y fuentes: cambian poco; el navegador puede guardarlos una semana.
  location ~* \.(png|jpg|webp|mp4|mp3|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Scripts, estilos y la página: «no-cache» = el navegador pregunta siempre al servidor si cambiaron (ETag) antes de usar su copia.
  # Sin esto, el navegador puede reutilizar un .js viejo y mezclarlo con un HTML nuevo (pantalla en blanco tras actualizar).
  # (En nginx, add_header dentro de un location reemplaza a los del server: por eso se repiten las cabeceras de seguridad.)
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;
  }
}
